[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "articula"
version = "0.2.0"
description = "Extract clean structured article data from URLs with tiered escalation strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "you jaebeom", email = "dbwo4011@gmail.com" }]
keywords = ["scraping", "article", "extraction", "web", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Base dependencies — deliberately lightweight
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "langdetect>=1.0.9",
    "python-dateutil>=2.9",
    "fake-useragent>=1.5",
    "urllib3>=2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://pypi.org/project/articula/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
# E501: line length is handled by the formatter, not the linter.
# SIM117: combining nested `with` blocks (e.g. a sync `with patch(...)` around
#         an `async with`) frequently hurts readability in tests, so we allow it.
ignore = ["E501", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use broad `pytest.raises(Exception)` and assert patterns.
"tests/**" = ["B017", "B011"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live'"
markers = [
    "timeout: mark test with a wall-clock timeout in seconds (requires pytest-timeout)",
    "live: mark test as requiring live network access — excluded by default (run with '-m live')",
]

[tool.coverage.run]
source = ["articula"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
